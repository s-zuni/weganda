workflows:
  # ══════════════════════════════════════════════════════════════════════════════
  # 🍎 1. iOS App Store & TestFlight 자동화 워크플로우 (Mac 없이 Windows에서 배포)
  # ══════════════════════════════════════════════════════════════════════════════
  ios-app-store:
    name: Weganda iOS App Store & TestFlight Production
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: weganda # Codemagic UI (Team Settings > Integrations > Apple Developer Portal)에 등록한 Key name
    environment:
      groups:
        - app_store_credentials # Codemagic UI의 Environment variables 그룹
      vars:
        BUNDLE_ID: "com.weganda.app"
        EXPO_PUBLIC_APP_ENV: "production"
        EXPO_PUBLIC_SUPABASE_URL: "https://vegtlnhgfjxdntnxbztb.supabase.co"
        EXPO_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZlZ3RsbmhnZmp4ZG50bnhienRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1NjU2NzUsImV4cCI6MjEwNDE0MTY3NX0.BouXAkcbuwwUvIBWxpP6Rxs7BhzN9evcEQMJiIwqo2g"
      node: 20.18.0
      xcode: 16.2
      cocoapods: default
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
        - pattern: 'feat_app'
          include: true
          source: true
    scripts:
      - name: 1. Install Node Dependencies
        script: |
          npm ci --legacy-peer-deps
          node scripts/patch-expo-modules-jsi.js
      - name: 2. Expo Prebuild (Generate Native iOS Project)
        script: |
          npx expo prebuild --platform ios --clean
      - name: 3. Set up Apple Code Signing via App Store Connect API
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
      - name: 4. Install CocoaPods Dependencies & Prebuild JSI Frameworks
        script: |
          set -e
          
          # Patch expo-modules-jsi for Xcode 16.2 / Swift 6.0
          node scripts/patch-expo-modules-jsi.js
          
          cd ios
          echo "=== CocoaPods Version ==="
          pod --version
          echo "=== Installing CocoaPods Dependencies ==="
          pod install --repo-update
          cd ..
          
          echo "=== Prebuilding ExpoModulesJSI xcframework for iPhoneOS ==="
          export PODS_ROOT="$(pwd)/ios/Pods"
          export PLATFORM_NAME="iphoneos"
          chmod +x node_modules/expo-modules-jsi/apple/scripts/*.sh
          ./node_modules/expo-modules-jsi/apple/scripts/build-xcframework.sh
          
          echo "=== Checking ExpoModulesJSI Products ==="
          ls -la node_modules/expo-modules-jsi/apple/Products/ExpoModulesJSI.xcframework
      - name: 5. Build iOS IPA (App Store Distribution)
        script: |
          export LC_ALL=en_US.UTF-8
          export LANG=en_US.UTF-8
          set -e
          
          cd ios
          echo "--- Directory contents of ios/ ---"
          ls -la
          
          WORKSPACE_NAME=$(ls -d *.xcworkspace 2>/dev/null | head -n 1)
          PROJECT_NAME=$(ls -d *.xcodeproj 2>/dev/null | head -n 1)
          
          if [ -n "$WORKSPACE_NAME" ]; then
            echo "=========================================="
            echo "Found Workspace: ios/$WORKSPACE_NAME"
            SCHEME_NAME="${WORKSPACE_NAME%.xcworkspace}"
            if command -v jq &> /dev/null; then
              DETECTED=$(xcodebuild -workspace "$WORKSPACE_NAME" -list -json 2>/dev/null | jq -r '.workspace.schemes[0] // .project.schemes[0]' 2>/dev/null)
              if [ -n "$DETECTED" ] && [ "$DETECTED" != "null" ]; then
                SCHEME_NAME="$DETECTED"
              fi
            fi
            echo "Found Scheme:    $SCHEME_NAME"
            echo "=========================================="
            cd ..
            xcode-project use-profiles
            xcode-project build-ipa \
              --workspace "ios/$WORKSPACE_NAME" \
              --scheme "$SCHEME_NAME" \
              --archive-xcargs "ENABLE_USER_SCRIPT_SANDBOXING=NO"
          elif [ -n "$PROJECT_NAME" ]; then
            echo "=========================================="
            echo "Found Project:   ios/$PROJECT_NAME"
            SCHEME_NAME="${PROJECT_NAME%.xcodeproj}"
            if command -v jq &> /dev/null; then
              DETECTED=$(xcodebuild -project "$PROJECT_NAME" -list -json 2>/dev/null | jq -r '.project.schemes[0]' 2>/dev/null)
              if [ -n "$DETECTED" ] && [ "$DETECTED" != "null" ]; then
                SCHEME_NAME="$DETECTED"
              fi
            fi
            echo "Found Scheme:    $SCHEME_NAME"
            echo "=========================================="
            cd ..
            xcode-project use-profiles
            xcode-project build-ipa \
              --project "ios/$PROJECT_NAME" \
              --scheme "$SCHEME_NAME" \
              --archive-xcargs "ENABLE_USER_SCRIPT_SANDBOXING=NO"
          else
            echo "Error: Neither .xcworkspace nor .xcodeproj found in ios directory!"
            exit 1
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration # Codemagic Apple Developer Portal 연동 키 사용
        submit_to_testflight: true
        expire_build_submitted_for_review: true
      email:
        recipients:
          - zxzx729@gmail.com
        notify:
          success: true
          failure: true

  # ══════════════════════════════════════════════════════════════════════════════
  # 🤖 2. Android Google Play AAB 자동화 워크플로우 (선택 사항: CI 클라우드 빌드)
  # ══════════════════════════════════════════════════════════════════════════════
  android-google-play:
    name: Weganda Android Google Play Production
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      vars:
        PACKAGE_NAME: "com.weganda.app"
        EXPO_PUBLIC_APP_ENV: "production"
        EXPO_PUBLIC_SUPABASE_URL: "https://vegtlnhgfjxdntnxbztb.supabase.co"
        EXPO_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZlZ3RsbmhnZmp4ZG50bnhienRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1NjU2NzUsImV4cCI6MjEwNDE0MTY3NX0.BouXAkcbuwwUvIBWxpP6Rxs7BhzN9evcEQMJiIwqo2g"
      node: 20.18.0
      java: 17
    scripts:
      - name: 1. Install Node Dependencies
        script: |
          npm ci --legacy-peer-deps
      - name: 2. Expo Prebuild (Generate Native Android Project)
        script: |
          npx expo prebuild --platform android --clean
      - name: 3. Build Android App Bundle (AAB)
        script: |
          cd android
          ./gradlew bundleRelease
          cd ..
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab

