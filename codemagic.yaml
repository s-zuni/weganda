workflows:
  # ══════════════════════════════════════════════════════════════════════════════
  # 🍎 1. iOS App Store & TestFlight 자동화 워크플로우 (Mac 없이 Windows에서 배포)
  # ══════════════════════════════════════════════════════════════════════════════
  ios-app-store:
    name: Weganda iOS App Store & TestFlight Production
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - app_store_credentials # Codemagic UI의 Environment variables 그룹
      vars:
        BUNDLE_ID: "com.weganda.app"
        XCODE_WORKSPACE: "ios/weganda.xcworkspace"
        XCODE_SCHEME: "weganda"
        EXPO_PUBLIC_APP_ENV: "production"
        EXPO_PUBLIC_SUPABASE_URL: "https://vegtlnhgfjxdntnxbztb.supabase.co"
        EXPO_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZlZ3RsbmhnZmp4ZG50bnhienRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1NjU2NzUsImV4cCI6MjEwNDE0MTY3NX0.BouXAkcbuwwUvIBWxpP6Rxs7BhzN9evcEQMJiIwqo2g"
      ios_signing:
        certificates:
          - weganda_2
        provisioning_profiles:
          - weganda_2
      node: 20.18.0
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
        - pattern: 'feat_app'
          include: true
          source: true
    scripts:
      - name: 1. Install Node Dependencies & Apply Native Patches
        script: |
          npm ci --legacy-peer-deps
          # Patch Package.swift to swift-tools-version: 6.0 and strip trailing commas
          node -e "const fs = require('fs'); const p = 'node_modules/expo-modules-jsi/apple/Package.swift'; if (fs.existsSync(p)) { let c = fs.readFileSync(p, 'utf8'); c = c.replace(/swift-tools-version: 6\.[0-9]+/g, 'swift-tools-version: 6.0'); c = c.replace(/,\s*\)/g, '\n)'); fs.writeFileSync(p, c); console.log('Patched Package.swift'); }"
          # Patch RuntimeScheduler.h for Swift 6.0 compatibility
          node -e "const fs = require('fs'); const p = 'node_modules/expo-modules-jsi/apple/Sources/ExpoModulesJSI-Cxx/include/RuntimeScheduler.h'; if (fs.existsSync(p)) { let c = fs.readFileSync(p, 'utf8'); if (!c.includes('#ifndef SWIFT_RETURNS_RETAINED')) { c = c.replace('#include <swift/bridging>', '#include <swift/bridging>\n\n#ifndef SWIFT_RETURNS_RETAINED\n#define SWIFT_RETURNS_RETAINED\n#endif'); fs.writeFileSync(p, c); console.log('Patched RuntimeScheduler.h with SWIFT_RETURNS_RETAINED fallback'); } }"
      - name: 2. Expo Prebuild (Generate Native iOS Project)
        script: |
          npx expo prebuild --platform ios --clean --no-install
          # Configure Node.js path for Xcode script build phases (Hermes & React Native bundle)
          echo "export NODE_BINARY=$(which node)" > ios/.xcode.env.local
          echo "=== Configured ios/.xcode.env.local ==="
          cat ios/.xcode.env.local
      - name: 3. Install CocoaPods Dependencies
        script: |
          set -e
          cd ios
          pod install --repo-update
          echo "=== iOS directory contents after pod install ==="
          ls -la
          cd ..
          # Disable User Script Sandboxing on Pods and Xcode project for Xcode 15/16 compatibility
          find ios -name "project.pbxproj" -exec sed -i '' 's/ENABLE_USER_SCRIPT_SANDBOXING = YES/ENABLE_USER_SCRIPT_SANDBOXING = NO/g' {} + 2>/dev/null || true
      - name: 4. Set up Apple Code Signing
        script: |
          keychain initialize
          
          # 1. Apple WWDR Intermediate CA 인증서 설치 (신뢰 체인 보증)
          echo "=== Installing Apple WWDR CA Certificates ==="
          curl -fSL "https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer" -o /tmp/AppleWWDRCAG3.cer
          curl -fSL "https://www.apple.com/certificateauthority/AppleWWDRCAG4.cer" -o /tmp/AppleWWDRCAG4.cer
          curl -fSL "https://www.apple.com/certificateauthority/AppleWWDRCAG6.cer" -o /tmp/AppleWWDRCAG6.cer
          security import /tmp/AppleWWDRCAG3.cer -k $(keychain list-keychains | head -n 1 | tr -d '" ') || true
          security import /tmp/AppleWWDRCAG4.cer -k $(keychain list-keychains | head -n 1 | tr -d '" ') || true
          security import /tmp/AppleWWDRCAG6.cer -k $(keychain list-keychains | head -n 1 | tr -d '" ') || true

          # 2. Codemagic에 등록된 배포 인증서 설치
          keychain add-certificates
          
          # 3. 키체인 내 유효한 코드 사이닝 인증서 진단
          echo "=== Available Code Signing Identities in Keychain ==="
          security find-identity -v -p codesigning || true
          
          # 4. 설치된 프로비저닝 프로파일 정보 확인
          echo "=== Installed Provisioning Profiles in ~/Library/MobileDevice ==="
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ || true
          for p in ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision; do
            if [ -f "$p" ]; then
              echo "--- Profile: $p ---"
              security cms -D -i "$p" 2>/dev/null | grep -E -A 1 "(<key>Name</key>|<key>UUID</key>|<key>application-identifier</key>|<key>ExpirationDate</key>)" || true
            fi
          done

          # 5. Xcode 프로젝트에 프로비저닝 프로파일 적용
          echo "=== Applying Provisioning Profiles to Xcode Project ==="
          xcode-project use-profiles \
            --project "ios/weganda.xcodeproj" \
            --warn-only
      - name: 5. Build iOS IPA (App Store Distribution)
        script: |
          set -e
          WORKSPACE=$(find ios -maxdepth 2 -name "*.xcworkspace" -not -path "*/Pods/*" -not -path "*.xcodeproj/*" | head -n 1)
          SCHEME="weganda"
          
          echo "=== Building iOS IPA ==="
          echo "Workspace: $WORKSPACE"
          echo "Scheme:    $SCHEME"
          
          # Run xcode-project build-ipa with User Script Sandboxing disabled
          if ! xcode-project build-ipa \
            --workspace "$WORKSPACE" \
            --scheme "$SCHEME" \
            --archive-xcargs "ENABLE_USER_SCRIPT_SANDBOXING=NO"; then
            echo "=========================================================="
            echo "❌ xcodebuild failed! Dumping relevant error logs..."
            echo "=========================================================="
            for log in /tmp/xcodebuild_logs/*.log; do
              if [ -f "$log" ]; then
                echo "--- Tail of $log ---"
                tail -n 120 "$log"
                echo "--- Grepping errors from $log ---"
                grep -E -C 2 -i "(error:|failed to|fatal error)" "$log" | tail -n 80 || true
              fi
            done
            exit 1
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        expire_build_submitted_for_review: true
      email:
        recipients:
          - zxzx729@gmail.com
        notify:
          success: true
          failure: true

  # ══════════════════════════════════════════════════════════════════════════════
  # 🤖 2. Android Google Play AAB 자동화 워크플로우 (선택 사항: CI 클라우드 빌드)
  # ══════════════════════════════════════════════════════════════════════════════
  android-google-play:
    name: Weganda Android Google Play Production
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      vars:
        PACKAGE_NAME: "com.weganda.app"
        EXPO_PUBLIC_APP_ENV: "production"
        EXPO_PUBLIC_SUPABASE_URL: "https://vegtlnhgfjxdntnxbztb.supabase.co"
        EXPO_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZlZ3RsbmhnZmp4ZG50bnhienRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1NjU2NzUsImV4cCI6MjEwNDE0MTY3NX0.BouXAkcbuwwUvIBWxpP6Rxs7BhzN9evcEQMJiIwqo2g"
      node: 20.18.0
      java: 17
    scripts:
      - name: 1. Install Node Dependencies
        script: |
          npm ci --legacy-peer-deps
      - name: 2. Expo Prebuild (Generate Native Android Project)
        script: |
          npx expo prebuild --platform android --clean
      - name: 3. Build Android App Bundle (AAB)
        script: |
          cd android
          ./gradlew bundleRelease
          cd ..
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab
