workflows:
  # ══════════════════════════════════════════════════════════════════════════════
  # 🍎 1. iOS App Store & TestFlight 자동화 워크플로우 (Mac 없이 Windows에서 배포)
  # ══════════════════════════════════════════════════════════════════════════════
  ios-app-store:
    name: Weganda iOS App Store & TestFlight Production
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - app_store_credentials # Codemagic UI의 Environment variables 그룹
      vars:
        BUNDLE_ID: "com.weganda.app"
        XCODE_WORKSPACE: "ios/weganda.xcworkspace"
        XCODE_SCHEME: "weganda"
        EXPO_PUBLIC_APP_ENV: "production"
        EXPO_PUBLIC_SUPABASE_URL: "https://vegtlnhgfjxdntnxbztb.supabase.co"
        EXPO_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZlZ3RsbmhnZmp4ZG50bnhienRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1NjU2NzUsImV4cCI6MjEwNDE0MTY3NX0.BouXAkcbuwwUvIBWxpP6Rxs7BhzN9evcEQMJiIwqo2g"
      ios_signing:
        certificates:
          - weganda_appstore
        provisioning_profiles:
          - weganda_appstore
      node: 20.18.0
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
        - tag
      branch_patterns:
        - pattern: 'main'
          include: true
          source: true
    scripts:
      - name: 1. Install Node Dependencies
        script: |
          npm ci --legacy-peer-deps
      - name: 2. Expo Prebuild & Enforce iPhone-Only Target
        script: |
          npx expo prebuild --platform ios --clean --no-install
          # iPhone 전용 타깃 보장 (TARGETED_DEVICE_FAMILY: 1 = iPhone)
          sed -i '' 's/TARGETED_DEVICE_FAMILY = "1,2"/TARGETED_DEVICE_FAMILY = "1"/g' ios/weganda.xcodeproj/project.pbxproj || true
          sed -i '' 's/TARGETED_DEVICE_FAMILY = 1,2/TARGETED_DEVICE_FAMILY = 1/g' ios/weganda.xcodeproj/project.pbxproj || true
          echo "=== Verified TARGETED_DEVICE_FAMILY in Xcode Project ==="
          grep -n "TARGETED_DEVICE_FAMILY" ios/weganda.xcodeproj/project.pbxproj || true
          # Configure Node.js path for Xcode script build phases
          echo "export NODE_BINARY=$(which node)" > ios/.xcode.env.local
          echo "=== Configured ios/.xcode.env.local ==="
          cat ios/.xcode.env.local
          # TestFlight 최신 빌드 번호 조회 후 자동 증가 (중복 업로드 에러 원천 방지)
          LATEST_BUILD=$(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" 2>/dev/null || echo "0")
          echo "=== Latest TestFlight build number: $LATEST_BUILD ==="
          if [ -n "$LATEST_BUILD" ] && [ "$LATEST_BUILD" -gt 0 ]; then
            NEXT_BUILD=$((LATEST_BUILD + 1))
            echo "=== Auto-incrementing build number to: $NEXT_BUILD ==="
            cd ios && agvtool new-version -all "$NEXT_BUILD" 2>/dev/null || true && cd ..
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $NEXT_BUILD" ios/weganda/Info.plist 2>/dev/null || true
            find ios -name "project.pbxproj" -exec sed -i '' "s/CURRENT_PROJECT_VERSION = [0-9]*/CURRENT_PROJECT_VERSION = $NEXT_BUILD/g" {} + 2>/dev/null || true
          fi
      - name: 3. Install CocoaPods Dependencies
        script: |
          set -e
          cd ios
          pod install --repo-update
          echo "=== iOS directory contents after pod install ==="
          ls -la
          cd ..
          # Disable User Script Sandboxing on Pods and Xcode project for Xcode 15/16 compatibility
          find ios -name "project.pbxproj" -exec sed -i '' 's/ENABLE_USER_SCRIPT_SANDBOXING = YES/ENABLE_USER_SCRIPT_SANDBOXING = NO/g' {} + 2>/dev/null || true
      - name: 4. Set up Apple Code Signing
        script: |
          keychain initialize
          keychain add-certificates
          echo "=== Available Code Signing Identities in Keychain ==="
          security find-identity -v -p codesigning || true
          echo "=== Installed Provisioning Profiles in ~/Library/MobileDevice ==="
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ || true
          for p in ~/Library/MobileDevice/Provisioning\ Profiles/*.mobileprovision; do
            if [ -f "$p" ]; then
              echo "--- Inspecting Profile: $p ---"
              security cms -D -i "$p" > /tmp/profile.plist 2>/dev/null || true
              /usr/libexec/PlistBuddy -c "Print :Name" /tmp/profile.plist 2>/dev/null || true
              /usr/libexec/PlistBuddy -c "Print :Type" /tmp/profile.plist 2>/dev/null || true
              if /usr/libexec/PlistBuddy -c "Print :ProvisionedDevices" /tmp/profile.plist 2>/dev/null; then
                echo "⚠️ WARNING: This profile contains ProvisionedDevices! It is an AD HOC profile, NOT App Store!"
              else
                echo "✅ Profile is valid for App Store distribution (No ProvisionedDevices)."
              fi
            fi
          done
          echo "=== Applying Provisioning Profiles to Xcode Project ==="
          xcode-project use-profiles \
            --project "ios/weganda.xcodeproj"
      - name: 5. Build iOS IPA (App Store Distribution)
        script: |
          WORKSPACE=$(find ios -maxdepth 2 -name "*.xcworkspace" -not -path "*/Pods/*" -not -path "*.xcodeproj/*" | head -n 1)
          SCHEME="weganda"
          
          echo "=== Building iOS IPA ==="
          if [ -n "$WORKSPACE" ]; then
            echo "Found workspace: $WORKSPACE, building scheme: $SCHEME"
            TARGET_ARG="--workspace $WORKSPACE"
          else
            PROJECT=$(find ios -maxdepth 1 -name "*.xcodeproj" | head -n 1)
            echo "Workspace not found. Falling back to project: $PROJECT, scheme: $SCHEME"
            TARGET_ARG="--project $PROJECT"
          fi

          if ! xcode-project build-ipa $TARGET_ARG --scheme "$SCHEME" --archive-xcargs "ENABLE_USER_SCRIPT_SANDBOXING=NO"; then
            echo "=========================================================="
            echo "❌ xcodebuild failed! Showing root cause error..."
            echo "=========================================================="
            for log in /tmp/xcodebuild_logs/*.log; do
              if [ -f "$log" ]; then
                echo "--- Filtered errors from $log ---"
                grep -E -C 2 -i "(error:|failed to|fatal error)" "$log" | tail -n 50 || true
              fi
            done
            exit 1
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        expire_build_submitted_for_review: true
      email:
        recipients:
          - zxzx729@gmail.com
        notify:
          success: true
          failure: true

  # ══════════════════════════════════════════════════════════════════════════════
  # 🤖 2. Android Google Play AAB 자동화 워크플로우 (선택 사항: CI 클라우드 빌드)
  # ══════════════════════════════════════════════════════════════════════════════
  android-google-play:
    name: Weganda Android Google Play Production
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      vars:
        PACKAGE_NAME: "com.weganda.app"
        EXPO_PUBLIC_APP_ENV: "production"
        EXPO_PUBLIC_SUPABASE_URL: "https://vegtlnhgfjxdntnxbztb.supabase.co"
        EXPO_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZlZ3RsbmhnZmp4ZG50bnhienRiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1NjU2NzUsImV4cCI6MjEwNDE0MTY3NX0.BouXAkcbuwwUvIBWxpP6Rxs7BhzN9evcEQMJiIwqo2g"
      node: 20.18.0
      java: 17
    scripts:
      - name: 1. Install Node Dependencies
        script: |
          npm ci --legacy-peer-deps
      - name: 2. Expo Prebuild (Generate Native Android Project)
        script: |
          npx expo prebuild --platform android --clean
      - name: 3. Build Android App Bundle (AAB)
        script: |
          cd android
          ./gradlew bundleRelease
          cd ..
    artifacts:
      - android/app/build/outputs/bundle/release/*.aab

