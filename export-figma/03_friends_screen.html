<!DOCTYPE html>
<html lang="ko" class="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>우간다 - 친구 (Friends)</title>
  <!-- Pretendard & Inter Web Fonts -->
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: '#FF507C', // Viva Coral Pink
            brandLight: '#FFF1F4',
            brandBorder: '#FFE4EA',
            shiftDay: '#4F98CA',
            shiftEve: '#E2703A',
            shiftNight: '#272727',
            shiftOff: '#E84A5F',
            bgGray: '#F8F9FA',
            borderGray: '#E5E7EB',
            textPrimary: '#1A1A1A',
            textSecondary: '#6B7280',
            textMuted: '#9CA3AF',
          },
          fontFamily: {
            sans: ['Pretendard', 'Inter', '-apple-system', 'BlinkMacSystemFont', 'system-ui', 'sans-serif'],
          },
          boxShadow: {
            soft: '0 2px 10px rgba(0, 0, 0, 0.04)',
            card: '0 4px 16px rgba(0, 0, 0, 0.05)',
            btn: '0 4px 12px rgba(255, 80, 124, 0.25)',
          }
        }
      }
    };
  </script>
  <style>
    body {
      font-family: 'Pretendard', sans-serif;
      background-color: #F3F4F6;
      margin: 0;
      padding: 20px 0;
      display: flex;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }
    .mobile-frame {
      width: 390px;
      min-height: 844px;
      background-color: #FFFFFF;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body>
  <div class="mobile-frame" id="friends-screen">
    
    <!-- 1. 스마트폰 시스템 상태바 -->
    <div class="w-full px-7 pt-3 pb-2 flex justify-between items-center text-xs font-semibold text-textPrimary bg-white">
      <span>09:41</span>
      <div class="flex items-center gap-1.5">
        <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 18.25c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0l.64-.64C7.93 20.26 9.88 21 12 21c4.97 0 9-4.03 9-9s-4.03-9-9-9zm0 16c-3.87 0-7-3.13-7-7s3.13-7 7-7 7 3.13 7 7-3.13 7-7 7z"/></svg>
        <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9v-2h2v2zm0-4H9V7h2v5z"/></svg>
        <div class="w-5 h-2.5 border border-textPrimary rounded-sm p-0.5 flex items-center">
          <div class="w-full h-full bg-textPrimary rounded-2xs"></div>
        </div>
      </div>
    </div>

    <!-- 2. AppHeader -->
    <header class="w-full px-5 py-3.5 flex justify-between items-center bg-white sticky top-0 z-30">
      <div class="flex items-center gap-2">
        <svg class="w-6 h-6 text-brand" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 16h5l3-8 6 16 4-10 3 5h5" />
        </svg>
        <h1 class="text-2xl font-black tracking-tight text-brand">우간다</h1>
      </div>
      <div class="flex items-center gap-3">
        <button class="relative w-9 h-9 flex items-center justify-center rounded-full hover:bg-bgGray">
          <svg class="w-5 h-5 text-textPrimary" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
        </button>
        <button class="w-9 h-9 flex items-center justify-center rounded-full hover:bg-bgGray">
          <svg class="w-5 h-5 text-textPrimary" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
        </button>
      </div>
    </header>

    <!-- 3. 메인 콘텐츠 -->
    <main class="flex-1 px-5 pb-24 overflow-y-auto no-scrollbar space-y-4">
      
      <!-- 겹치는 근무 배너 (SharedShiftBanner) -->
      <section class="mt-1 bg-brandLight border border-brandBorder rounded-2xl p-3.5 flex items-center gap-3 shadow-soft">
        <div class="w-9 h-9 rounded-full bg-white flex items-center justify-center text-brand shrink-0 shadow-sm">
          <svg class="w-5 h-5 text-brand" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        </div>
        <div class="flex-1">
          <h2 class="text-sm font-extrabold text-textPrimary">
            오늘 김민서님 등 <span class="text-brand font-black">3명</span>과 근무가 겹쳐요!
          </h2>
          <p class="text-xs font-bold text-brand mt-0.5">
            실시간 근무표 및 인계 파트너 확인하기 ›
          </p>
        </div>
      </section>

      <!-- 탭 스위처 ([동기 목록] vs [그룹/병동]) -->
      <section class="flex bg-bgGray p-1 rounded-xl border border-borderGray">
        <button class="flex-1 py-2 text-xs font-extrabold text-brand bg-white rounded-lg shadow-sm">
          동기 목록 (6)
        </button>
        <button class="flex-1 py-2 text-xs font-semibold text-textMuted hover:text-textPrimary">
          그룹 / 병동 (3)
        </button>
      </section>

      <!-- 검색 & 친구 추가 바 -->
      <section class="flex gap-2.5 items-center">
        <div class="flex-1 flex items-center gap-2 bg-bgGray border border-borderGray rounded-xl px-3.5 h-11">
          <svg class="w-4 h-4 text-textMuted" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" placeholder="동기 이름, 병원, 병동 검색" class="bg-transparent text-sm text-textPrimary placeholder-textMuted outline-none w-full" value="" />
        </div>
        <button class="bg-brand text-white text-xs font-bold px-4 h-11 rounded-xl flex items-center gap-1 shadow-btn">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          <span>추가</span>
        </button>
      </section>

      <!-- 1. 상단 고정 즐겨찾기 친구 섹션 -->
      <section class="space-y-2.5">
        <div class="flex items-center gap-1.5 px-0.5">
          <span class="text-amber-400">★</span>
          <h3 class="text-sm font-extrabold text-textPrimary">상단 고정 즐겨찾기 (2)</h3>
        </div>

        <!-- 동기 1: 김민서 -->
        <div class="bg-white border border-borderGray rounded-2xl p-3.5 shadow-soft flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="w-11 h-11 rounded-full bg-pink-100 text-pink-700 font-bold flex items-center justify-center text-base">
              김
            </div>
            <div>
              <div class="flex items-center gap-1.5">
                <span class="text-base font-bold text-textPrimary">김민서</span>
                <span class="bg-shiftDay text-white text-2xs font-extrabold px-1.5 py-0.5 rounded">D</span>
                <span class="text-amber-400 text-xs">★</span>
              </div>
              <p class="text-xs text-textMuted mt-0.5">서울대병원 • 71병동 ICU</p>
            </div>
          </div>
          <button class="bg-brandLight text-brand text-xs font-bold px-3 py-1.5 rounded-xl flex items-center gap-1">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <span>메시지</span>
          </button>
        </div>

        <!-- 동기 2: 이지은 -->
        <div class="bg-white border border-borderGray rounded-2xl p-3.5 shadow-soft flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="w-11 h-11 rounded-full bg-blue-100 text-blue-700 font-bold flex items-center justify-center text-base">
              이
            </div>
            <div>
              <div class="flex items-center gap-1.5">
                <span class="text-base font-bold text-textPrimary">이지은</span>
                <span class="bg-shiftNight text-white text-2xs font-extrabold px-1.5 py-0.5 rounded">N</span>
                <span class="text-amber-400 text-xs">★</span>
              </div>
              <p class="text-xs text-textMuted mt-0.5">서울아산병원 • 응급중환자실</p>
              <span class="inline-block mt-1 bg-amber-50 text-amber-700 border border-amber-200/60 text-3xs font-extrabold px-1.5 py-0.2 rounded">
                취침 중 (연락자제)
              </span>
            </div>
          </div>
          <button class="bg-brandLight text-brand text-xs font-bold px-3 py-1.5 rounded-xl flex items-center gap-1">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <span>메시지</span>
          </button>
        </div>
      </section>

      <!-- 2. 전체 동기 목록 섹션 -->
      <section class="space-y-2.5">
        <div class="px-0.5">
          <h3 class="text-sm font-extrabold text-textPrimary">전체 동기 (4)</h3>
        </div>

        <!-- 동기 3: 박수현 -->
        <div class="bg-white border border-borderGray rounded-2xl p-3.5 shadow-soft flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="w-11 h-11 rounded-full bg-orange-100 text-orange-700 font-bold flex items-center justify-center text-base">
              박
            </div>
            <div>
              <div class="flex items-center gap-1.5">
                <span class="text-base font-bold text-textPrimary">박수현</span>
                <span class="bg-shiftEve text-white text-2xs font-extrabold px-1.5 py-0.5 rounded">E</span>
              </div>
              <p class="text-xs text-textMuted mt-0.5">삼성서울병원 • 혈액종양내과</p>
            </div>
          </div>
          <button class="bg-brandLight text-brand text-xs font-bold px-3 py-1.5 rounded-xl flex items-center gap-1">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <span>메시지</span>
          </button>
        </div>

        <!-- 동기 4: 최유나 -->
        <div class="bg-white border border-borderGray rounded-2xl p-3.5 shadow-soft flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="w-11 h-11 rounded-full bg-emerald-100 text-emerald-700 font-bold flex items-center justify-center text-base">
              최
            </div>
            <div>
              <div class="flex items-center gap-1.5">
                <span class="text-base font-bold text-textPrimary">최유나</span>
                <span class="bg-shiftOff text-white text-2xs font-extrabold px-1.5 py-0.5 rounded">O</span>
              </div>
              <p class="text-xs text-textMuted mt-0.5">세브란스병원 • 중앙수술실</p>
            </div>
          </div>
          <button class="bg-brandLight text-brand text-xs font-bold px-3 py-1.5 rounded-xl flex items-center gap-1">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <span>메시지</span>
          </button>
        </div>

        <!-- 동기 5: 정다은 -->
        <div class="bg-white border border-borderGray rounded-2xl p-3.5 shadow-soft flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="w-11 h-11 rounded-full bg-purple-100 text-purple-700 font-bold flex items-center justify-center text-base">
              정
            </div>
            <div>
              <div class="flex items-center gap-1.5">
                <span class="text-base font-bold text-textPrimary">정다은</span>
                <span class="bg-shiftDay text-white text-2xs font-extrabold px-1.5 py-0.5 rounded">D</span>
              </div>
              <p class="text-xs text-textMuted mt-0.5">국립중앙의료원 • 일반병동</p>
            </div>
          </div>
          <button class="bg-brandLight text-brand text-xs font-bold px-3 py-1.5 rounded-xl flex items-center gap-1">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            <span>메시지</span>
          </button>
        </div>
      </section>

    </main>

    <!-- 4. 하단 탭바 -->
    <nav class="w-full bg-white border-t border-borderGray px-4 py-2 flex justify-around items-center absolute bottom-0 left-0 z-30">
      <!-- 1. 홈 -->
      <button class="flex flex-col items-center gap-1 text-textMuted hover:text-textPrimary">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        <span class="text-2xs font-semibold">홈</span>
      </button>
      <!-- 2. 운세 -->
      <button class="flex flex-col items-center gap-1 text-textMuted hover:text-textPrimary">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        <span class="text-2xs font-semibold">운세</span>
      </button>
      <!-- 3. 친구 (Active) -->
      <button class="flex flex-col items-center gap-1 text-brand">
        <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span class="text-2xs font-bold">친구</span>
      </button>
      <!-- 4. 교육 -->
      <button class="flex flex-col items-center gap-1 text-textMuted hover:text-textPrimary">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
        <span class="text-2xs font-semibold">교육</span>
      </button>
      <!-- 5. 커뮤니티 -->
      <button class="flex flex-col items-center gap-1 text-textMuted hover:text-textPrimary">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span class="text-2xs font-semibold">커뮤니티</span>
      </button>
    </nav>

  </div>
</body>
</html>
